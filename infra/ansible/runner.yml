# Self-hosted GitHub Actions runner for the tropicast organization.
# Setup: docs/how-to/set-up-ci-runner.md
#
# First run (registers the runner; the token is valid for one hour):
#   token=$(gh api -X POST orgs/tropicast/actions/runners/registration-token --jq .token)
#   ansible-playbook runner.yml -e runner_registration_token="$token"
# Later runs need no token: each instance registers only once. To add an
# instance, append it to runner_instances and run again with a new token.
- name: CI runner
  hosts: runners
  # Root needs no sudo; the first run on a fresh server may lack it.
  become: "{{ (ansible_user | default('root')) != 'root' }}"
  vars:
    ssh_allow_users: [ops]
    runner_version: "2.338.0"
    # Published in the release notes of actions/runner v2.338.0.
    runner_sha256: af4b794c1bc41d73d40535e3fe092a39f9679cd8d965954c2aca25a05ca41d32
    runner_org_url: https://github.com/tropicast
    # Two processes share the CX33 (4 vCPU, 8 GB) and its Docker build
    # cache. The first keeps its original directory and name.
    runner_instances:
      - name: "{{ inventory_hostname }}"
        dir: /opt/actions-runner
      - name: "{{ inventory_hostname }}-2"
        dir: /opt/actions-runner-2
    runner_labels: [hetzner, fsn1]
  pre_tasks:
    - name: Require admin keys
      ansible.builtin.assert:
        that: ops_ssh_keys | default([]) | length > 0
        fail_msg: Set ops_ssh_keys in group_vars/all.yml.

  tasks:
    - name: Host baseline (users, SSH, updates, Docker)
      ansible.builtin.import_tasks: tasks/baseline.yml

    # Tools the workflows expect, as on GitHub's ubuntu-latest image.
    - name: Install CI tools
      ansible.builtin.apt:
        name:
          - build-essential
          - ffmpeg
          - git
          - jq
          - openssl
          - python3
          - shellcheck
          - unzip
          - zstd

    # The runner user runs jobs. Docker access is root-equivalent anyway, so
    # it also gets passwordless sudo (workflows call `sudo apt-get`). Keep
    # this VM dedicated to CI.
    - name: Create the runner user
      ansible.builtin.user:
        name: runner
        shell: /bin/bash
        groups: docker
        append: true

    - name: Allow the runner user to sudo without a password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/91-runner
        mode: "0440"
        content: "runner ALL=(ALL) NOPASSWD:ALL\n"
        validate: visudo -cf %s

    - name: Download the runner
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
        dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
        checksum: "sha256:{{ runner_sha256 }}"
        mode: "0644"

    # One process per instance; each runs one job at a time.
    - name: Set up each runner instance
      ansible.builtin.include_tasks: tasks/runner-instance.yml
      loop: "{{ runner_instances }}"
      loop_control:
        loop_var: instance
        label: "{{ instance.name }}"

    # Keep disk use bounded but keep a warm build cache.
    - name: Install the weekly Docker cleanup
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: docker-cleanup.service
          content: |
            [Unit]
            Description=Prune old Docker images and excess build cache

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/docker system prune -af --filter until=168h
            ExecStart=/usr/bin/docker builder prune -f --keep-storage 20GB
        - name: docker-cleanup.timer
          content: |
            [Unit]
            Description=Weekly Docker cleanup

            [Timer]
            OnCalendar=Sun 03:00
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      notify: Reload systemd units

    - name: Enable the weekly Docker cleanup
      ansible.builtin.systemd_service:
        name: docker-cleanup.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Shared handlers
      ansible.builtin.import_tasks: handlers/main.yml

    - name: Reload systemd units
      ansible.builtin.systemd_service:
        daemon_reload: true
