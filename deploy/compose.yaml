# Production stack for one streaming node (#11). Deployed to
# /opt/tc-streaming by deploy.sh; secrets come from /opt/tc-streaming/.env.
# Icecast has no published port: Caddy is the only public entry point.
name: tc-streaming

services:
  icecast:
    image: ghcr.io/tropicast/icecast:${ICECAST_IMAGE_TAG:?ICECAST_IMAGE_TAG is set by deploy.sh}
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?}
      ICECAST_HOSTNAME: ${LISTEN_HOST:?}
      ICECAST_SOURCE_AUTH_URL: ${ICECAST_SOURCE_AUTH_URL:?}
      ICECAST_SOURCE_AUTH_USER: ${ICECAST_SOURCE_AUTH_USER:?}
      ICECAST_SOURCE_AUTH_PASSWORD: ${ICECAST_SOURCE_AUTH_PASSWORD:?}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Station limits (#8), applied with `deploy.sh apply-stations`.
    volumes:
      - ./stations.json:/etc/icecast/stations.json:ro

  caddy:
    # Caddy with the layer4 module (caddy/Dockerfile): the ingest host
    # passes raw Icecast source streams through after TLS.
    image: ghcr.io/tropicast/caddy:${CADDY_IMAGE_TAG:?CADDY_IMAGE_TAG is set by deploy.sh}
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      LISTEN_HOST: ${LISTEN_HOST:?}
      INGEST_HOST: ${INGEST_HOST:?}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      # A directory mount, so deploy.sh can replace the Caddyfile and run
      # `caddy reload` without recreating the container (and dropping
      # every listener).
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  # Temporary stand-in for the control-plane auth endpoint, until the API
  # exists. Enabled only with COMPOSE_PROFILES=stub. Never leave it on with
  # real customers.
  auth-stub:
    profiles: ["stub"]
    image: python:3.14-slim
    restart: unless-stopped
    command: ["python3", "-u", "/srv/server.py"]
    volumes:
      - ./auth-stub/server.py:/srv/server.py:ro
      - ./stations.json:/etc/icecast/stations.json:ro
    environment:
      STUB_LIMITS_FILE: /etc/icecast/stations.json
      STUB_ICECAST_USER: ${ICECAST_SOURCE_AUTH_USER:?}
      STUB_ICECAST_PASSWORD: ${ICECAST_SOURCE_AUTH_PASSWORD:?}
      STUB_STATIONS: ${STUB_STATIONS:-}

  # AutoDJ playout worker (#63), enabled with COMPOSE_PROFILES=autodj.
  # Plays each AutoDJ station's playlist to its hidden autodj.<fmt> mounts
  # (#62) over the internal network; no published port. Reads the desired
  # state from the control plane (tc-dashboard#107) over the private network.
  # Restarting it drops the listeners who are on AutoDJ at that moment.
  playout:
    profiles: ["autodj"]
    image: ghcr.io/tropicast/playout:${PLAYOUT_IMAGE_TAG:-unset}
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      PLAYOUT_URL: ${PLAYOUT_URL:-}
      PLAYOUT_USER: ${PLAYOUT_USER:-}
      PLAYOUT_PASSWORD: ${PLAYOUT_PASSWORD:-}
    # Bounded so AutoDJ can never starve Icecast or Caddy (#65). cpu_shares
    # is the container's weight against the others (cgroup v2 cpu.weight 59
    # vs 100): on a busy node, encoding waits, listeners do not. A nice value
    # inside the container would not do that, it only orders processes within
    # its own cgroup. Sizing: docs/load-test.md#autodj-playout.
    cpus: ${PLAYOUT_CPUS:-1.5}
    cpu_shares: 512
    mem_limit: ${PLAYOUT_MEMORY:-2g}
    # Threads count: about 28 per station (bench). 1024 lets memory be the
    # limit that binds first (2g is about 20 stations), not this one.
    pids_limit: 1024
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/playout:uid=100,gid=101,mode=0750
      - /tmp:size=16m
    volumes:
      - playout-cache:/var/cache/playout

  # Monitoring (#10), enabled with COMPOSE_PROFILES=monitoring.
  # Reads Icecast's admin stats and the Hetzner traffic counters.
  icecast-exporter:
    profiles: ["monitoring"]
    image: python:3.14-slim
    restart: unless-stopped
    command: ["python3", "-u", "/srv/icecast_exporter.py"]
    volumes:
      - ./exporter/icecast_exporter.py:/srv/icecast_exporter.py:ro
      # AutoDJ stations (#66).
      - ./stations.json:/etc/icecast/stations.json:ro
    # The control plane (tc-dashboard#10) reads it over the private network.
    # Hetzner firewalls do not filter that network; nothing else listens there.
    # Without PRIVATE_IP, loopback only.
    ports:
      - "${PRIVATE_IP:-127.0.0.1}:9100:9100"
    environment:
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-}
      HCLOUD_READ_TOKEN: ${HCLOUD_READ_TOKEN:-}
      HCLOUD_SERVER_NAME: ${NODE_NAME:-}
      # Release on the node (#59): deploy.sh exports them from release.env.
      TC_STREAMING_VERSION: ${TC_STREAMING_VERSION:-0.0.0}
      TC_STREAMING_REVISION: ${TC_STREAMING_REVISION:-unknown}

  # Docker API for Alloy's log collection (#46). Only these GET calls pass:
  # ping/version, container list, container inspect and logs, network list.
  # Everything else (exec, create, start, archive/export, any write) is
  # refused. Inspect returns container environments, which Alloy can read
  # from the host filesystem anyway (/host/root). Reachable only from Alloy,
  # on the internal docker-api network.
  docker-socket-proxy:
    profiles: ["monitoring"]
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowGET=^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[0-9a-f]+/(json|logs)|networks)$$
      - -shutdowngracetime=5
    # Root only to open the socket (owned by root:docker, whose GID differs
    # per host); no capabilities, read-only filesystem.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  # Ships host and Icecast metrics and Icecast logs to Grafana Cloud.
  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    pid: host
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-api
    volumes:
      - ./alloy:/etc/alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - alloy-data:/var/lib/alloy/data
    # Hide the host's /run, so Alloy cannot reach docker.sock or
    # containerd.sock through /host/root and bypass docker-socket-proxy.
    # The node exporter already skips /run mount points.
    tmpfs:
      - /host/root/run:ro,size=1m
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      NODE_NAME: ${NODE_NAME:-local}

volumes:
  caddy-data:
  caddy-config:
  alloy-data:
  playout-cache:

networks:
  default:
  # No route out: only Alloy and docker-socket-proxy are attached.
  docker-api:
    internal: true
