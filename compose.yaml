services:
  icecast:
    build: .
    # ICECAST_IMAGE / CADDY_IMAGE let CI test a per-run image tag.
    image: ${ICECAST_IMAGE:-tropicast-icecast:local}
    env_file:
      - path: .env
        required: false
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Set ICECAST_SOURCE_PASSWORD in .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?Set ICECAST_ADMIN_PASSWORD in .env}
      ICECAST_SOURCE_AUTH_URL: ${ICECAST_SOURCE_AUTH_URL:-http://auth-stub:9000/icecast/source}
      ICECAST_SOURCE_AUTH_USER: ${ICECAST_SOURCE_AUTH_USER:?Set ICECAST_SOURCE_AUTH_USER in .env}
      ICECAST_SOURCE_AUTH_PASSWORD: ${ICECAST_SOURCE_AUTH_PASSWORD:?Set ICECAST_SOURCE_AUTH_PASSWORD in .env}
    # Each listener holds one file descriptor for the whole session.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${ICECAST_PORT:-8000}:8000"
    # Station limits (#8); STATIONS_JSON points tests at their own file.
    volumes:
      - ${STATIONS_JSON:-./deploy/stations.example.json}:/etc/icecast/stations.json:ro

  caddy:
    build: ./caddy
    image: ${CADDY_IMAGE:-tropicast-caddy:local}
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      LISTEN_HOST: ${LISTEN_HOST:?Set LISTEN_HOST in .env}
      INGEST_HOST: ${INGEST_HOST:?Set INGEST_HOST in .env}
      # "local_certs" for local runs; empty in production (Let's Encrypt).
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Development and CI only: stands in for the control-plane auth endpoint.
  auth-stub:
    image: python:3.12-slim
    command: ["python3", "-u", "/srv/server.py"]
    volumes:
      - ./auth-stub/server.py:/srv/server.py:ro
      - ${STATIONS_JSON:-./deploy/stations.example.json}:/etc/icecast/stations.json:ro
    environment:
      STUB_LIMITS_FILE: /etc/icecast/stations.json
      STUB_ICECAST_USER: ${ICECAST_SOURCE_AUTH_USER}
      STUB_ICECAST_PASSWORD: ${ICECAST_SOURCE_AUTH_PASSWORD}
      STUB_STATIONS: ${STUB_STATIONS:-}

  # Monitoring (#10), enabled with COMPOSE_PROFILES=monitoring.
  # Reads Icecast's admin stats and the Hetzner traffic counters.
  icecast-exporter:
    profiles: ["monitoring"]
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python3", "-u", "/srv/icecast_exporter.py"]
    volumes:
      - ./exporter/icecast_exporter.py:/srv/icecast_exporter.py:ro
    environment:
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-}
      HCLOUD_READ_TOKEN: ${HCLOUD_READ_TOKEN:-}
      HCLOUD_SERVER_NAME: ${NODE_NAME:-}

  # Ships host and Icecast metrics to Grafana Cloud.
  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    pid: host
    volumes:
      - ./deploy/alloy:/etc/alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      NODE_NAME: ${NODE_NAME:-local}

volumes:
  caddy-data:
  caddy-config:
  alloy-data:
