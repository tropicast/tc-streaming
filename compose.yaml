services:
  icecast:
    build: .
    image: tropicast-icecast:local
    env_file:
      - path: .env
        required: false
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Set ICECAST_SOURCE_PASSWORD in .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?Set ICECAST_ADMIN_PASSWORD in .env}
      ICECAST_SOURCE_AUTH_URL: ${ICECAST_SOURCE_AUTH_URL:-http://auth-stub:9000/icecast/source}
      ICECAST_SOURCE_AUTH_USER: ${ICECAST_SOURCE_AUTH_USER:?Set ICECAST_SOURCE_AUTH_USER in .env}
      ICECAST_SOURCE_AUTH_PASSWORD: ${ICECAST_SOURCE_AUTH_PASSWORD:?Set ICECAST_SOURCE_AUTH_PASSWORD in .env}
    # Each listener holds one file descriptor for the whole session.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${ICECAST_PORT:-8000}:8000"

  # Development and CI only: stands in for the control-plane auth endpoint.
  auth-stub:
    image: python:3.12-slim
    command: ["python3", "-u", "/srv/server.py"]
    volumes:
      - ./auth-stub/server.py:/srv/server.py:ro
    environment:
      STUB_ICECAST_USER: ${ICECAST_SOURCE_AUTH_USER}
      STUB_ICECAST_PASSWORD: ${ICECAST_SOURCE_AUTH_PASSWORD}
      STUB_STATIONS: ${STUB_STATIONS:-}
