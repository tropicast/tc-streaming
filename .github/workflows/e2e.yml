name: E2E

# Source auth (#7), gateway (#6) and monitoring (#10) end-to-end tests in one job: ffmpeg is
# installed once and both images are built once, from the same GHA cache as
# image.yml and caddy-image.yml. Image tags, Compose projects and ports are
# unique per run, so parallel jobs on one runner do not collide.
on:
  pull_request:
    paths: &paths
      - Dockerfile
      - docker-entrypoint.py
      - icecast.xml
      - .dockerignore
      - caddy/**
      - compose.yaml
      - auth-stub/**
      - tests/**
      - exporter/**
      - deploy/alloy/**
      - monitoring/**
      - deploy/stations.example.json
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

# A newer push to the same PR replaces the running tests.
concurrency:
  # PRs share one group per PR; each main commit gets its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only PRs: runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # Per-job Docker config: keep registry logins and buildx state in this job.
      - name: Isolate the Docker config
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the Icecast image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tropicast-icecast:e2e-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=icecast
          cache-to: type=gha,mode=max,scope=icecast

      - name: Build the Caddy image
        uses: docker/build-push-action@v6
        with:
          context: caddy
          load: true
          tags: tropicast-caddy:e2e-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Install ffmpeg
        run: command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }

      - name: Source auth
        run: tests/source-auth.sh
        env:
          E2E_PREBUILT: "1"
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ICECAST_IMAGE: tropicast-icecast:e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CADDY_IMAGE: tropicast-caddy:e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Gateway
        run: tests/gateway.sh
        env:
          E2E_PREBUILT: "1"
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ICECAST_IMAGE: tropicast-icecast:e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CADDY_IMAGE: tropicast-caddy:e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Station limits
        run: tests/station-limits.sh
        env:
          E2E_PREBUILT: "1"
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ICECAST_IMAGE: tropicast-icecast:e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CADDY_IMAGE: tropicast-caddy:e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v3.15.0 test rules rules.test.yaml

      - name: Monitoring
        run: tests/monitoring.sh
        env:
          E2E_PREBUILT: "1"
          TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ICECAST_IMAGE: tropicast-icecast:e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CADDY_IMAGE: tropicast-caddy:e2e-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove the per-run images
        if: always()
        run: docker rmi -f "tropicast-icecast:e2e-${{ github.run_id }}-${{ github.run_attempt }}" "tropicast-caddy:e2e-${{ github.run_id }}-${{ github.run_attempt }}" >/dev/null 2>&1 || true
