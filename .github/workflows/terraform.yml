name: Terraform

on:
  pull_request:
    paths:
      - infra/terraform/**
      - infra/loadgen/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - infra/loadgen/**

permissions:
  contents: read

# A newer push to the same PR replaces the running build.
concurrency:
  # PRs share one group per PR; each main commit gets its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only PRs: runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The streaming node, and the load generator of the load tests (#96).
        dir: [infra/terraform, infra/loadgen]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
