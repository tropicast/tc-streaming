name: Source auth

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - icecast.xml
      - compose.yaml
      - auth-stub/**
      - tests/source-auth.sh
      - .github/workflows/source-auth.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: tests/source-auth.sh
