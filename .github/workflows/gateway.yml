name: Gateway

on:
  pull_request:
    paths:
      - caddy/**
      - compose.yaml
      - icecast.xml
      - docker-entrypoint.py
      - tests/gateway.sh
      - .github/workflows/gateway.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: tests/gateway.sh
