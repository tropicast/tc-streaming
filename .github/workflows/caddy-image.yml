name: Caddy image

# Caddy with the layer4 module (caddy/Dockerfile), used by the gateway.
on:
  pull_request:
    paths:
      - caddy/Dockerfile
      - caddy/.dockerignore
      - .github/workflows/caddy-image.yml
  # Keep these paths identical to the Caddy list in deploy.yml ("Resolve the
  # release"): a deploy uses the image of the last main commit that touched
  # them.
  push:
    branches: [main]
    paths:
      - caddy/Dockerfile
      - caddy/.dockerignore

permissions:
  contents: read

# A newer push to the same PR replaces the running build.
concurrency:
  # PRs share one group per PR; each main commit gets its own.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # On main, every image build must finish so its tag exists for deploys
  # and rollbacks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy

jobs:
  build:
    # Unset: GitHub-hosted ubuntu-latest.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker config: keep registry logins and buildx state in this job.
      - name: Isolate the Docker config
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=sha,format=long

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: caddy
          load: true
          tags: tropicast-caddy:ci-${{ github.run_id }}-${{ github.run_attempt }}
          # Shared with e2e.yml.
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Check the layer4 module is built in
        run: docker run --rm tropicast-caddy:ci-${{ github.run_id }}-${{ github.run_attempt }} caddy list-modules | grep -qx 'layer4.handlers.proxy'

      # Reuse the vulnerability DB for a day instead of downloading it each run.
      # Kept per job ($RUNNER_TEMP) so parallel scans do not share one DB.
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-db-${{ steps.today.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan for critical vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.67.2 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            tropicast-caddy:ci-${{ github.run_id }}-${{ github.run_attempt }}

      # Trivy writes the DB as root; let the cache step read it.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/trivy"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        name: Push
        uses: docker/build-push-action@v6
        with:
          context: caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=caddy

      - name: Remove the per-run image
        if: always()
        run: docker rmi -f "tropicast-caddy:ci-${{ github.run_id }}-${{ github.run_attempt }}" >/dev/null 2>&1 || true
