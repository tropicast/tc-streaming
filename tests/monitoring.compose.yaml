# Test-only overlay for tests/monitoring.sh: a local Prometheus that accepts
# remote write, standing in for Grafana Cloud.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROM_PORT:-9090}:9090"
